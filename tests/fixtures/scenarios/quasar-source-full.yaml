    actions:
      - action_code: 987
        targets: [2, 3]
        parameters:
          mode: strike
  - kind: ASSERT
    step_id: citizen-2-dead
    field: alive
    operator: EQ
    expected: false
    seat: 2
  - kind: ASSERT
    step_id: citizen-3-dead
    field: alive
    operator: EQ
    expected: false
    seat: 3
  - kind: ASSERT
    step_id: full-game-closed
    field: run_status
    operator: EQ
    expected: CLOSED
  - kind: ASSERT
    step_id: archive-verified
    field: archive_verified
    operator: EQ
    expected: true
  - kind: ASSERT
    step_id: snapshot-verified
    field: snapshot_verified
    operator: EQ
    expected: true
