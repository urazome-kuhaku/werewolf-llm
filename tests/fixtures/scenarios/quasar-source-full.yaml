schema_version: 1
scenario_id: quasar-source-full-strike
board_ref: quasar_echo_lab@1.0.0
mode: FULL_GAME
budget:
  max_commands: 500
  max_turns: 150
  max_rounds: 10
required_skill_ids: [quasar_echo_unfamiliar]
steps:
